<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我们 — 恒工五金 | 获取方案报价</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<header class="site-header"></header>

<section class="page-banner">
  <h1>联系我们</h1>
  <p>来图报价 · 打样定制 · 预约验厂</p>
  <div class="breadcrumb"><a href="index.html">首页</a> / 联系我们</div>
</section>

<section class="section">
  <div class="container">
    <div class="contact-layout">

      <!-- 留言表单 -->
      <div class="form-card">
        <h3>在线留言，24小时内回复</h3>
        <form data-demo>
          <div class="field">
            <label>姓名 <span class="req">*</span></label>
            <input type="text" name="name" required placeholder="请输入您的称呼">
          </div>
          <div class="field">
            <label>电话 <span class="req">*</span></label>
            <input type="tel" name="phone" required placeholder="方便联系的手机号码">
          </div>
          <div class="field">
            <label>公司名称</label>
            <input type="text" name="company" placeholder="贵司名称（选填）">
          </div>
          <div class="field">
            <label>需求描述 <span class="req">*</span></label>
            <textarea id="need" name="need" required placeholder="请简述产品品类、大致数量、是否有图纸等"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">提交留言</button>
          <div class="form-ok">✓ 提交成功！我们将在24小时内与您联系。（演示环境：正式上线请对接表单服务）</div>
        </form>
      </div>

      <!-- 联系信息 + 地图 -->
      <div>
        <div class="info-list">
          <div class="info-item">
            <span class="ico">📞</span>
            <div>
              <h4>联系电话</h4>
              <p>0000-0000 0000（请替换为真实电话）</p>
            </div>
          </div>
          <div class="info-item">
            <span class="ico">✉️</span>
            <div>
              <h4>电子邮箱</h4>
              <p>sales@henggong-hw.com（请替换）</p>
            </div>
          </div>
          <div class="info-item">
            <span class="ico">📍</span>
            <div>
              <h4>工厂地址</h4>
              <p>本地工业园区 XX 路 88 号（请替换）</p>
            </div>
          </div>
          <div class="info-item">
            <span class="ico">🕐</span>
            <div>
              <h4>工作时间</h4>
              <p>周一至周六 8:00 - 18:00</p>
            </div>
          </div>
        </div>

        <!-- 地图占位：正式上线可替换为腾讯地图 iframe 嵌入 -->
        <div class="map-box" title="地图占位，可替换为腾讯地图嵌入代码">
          <svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
            <rect width="640" height="320" fill="#0e2138"/>
            <g stroke="#1b3a5c" stroke-width="14" fill="none">
              <path d="M-20 90 L340 60 L680 110"/>
              <path d="M-20 210 L300 240 L680 190"/>
              <path d="M180 -20 L210 340"/>
              <path d="M460 -20 L430 340"/>
            </g>
            <g stroke="#13304e" stroke-width="6" fill="none">
              <path d="M-20 150 L680 150"/><path d="M320 -20 L320 340"/>
            </g>
            <circle cx="320" cy="150" r="46" fill="#f2b705" opacity=".12"/>
            <path d="M320 105 c-20 0 -34 15 -34 34 c0 26 34 56 34 56 s34 -30 34 -56 c0 -19 -14 -34 -34 -34 z" fill="#f2b705"/>
            <circle cx="320" cy="139" r="13" fill="#0e2138"/>
            <text x="320" y="252" text-anchor="middle" fill="#9fb0c1" font-size="15" font-family="sans-serif">恒工五金 · 本地工业园区</text>
            <text x="320" y="278" text-anchor="middle" fill="#6b7f94" font-size="12" font-family="sans-serif">（正式上线时替换为腾讯地图嵌入）</text>
          </svg>
        </div>
      </div>

    </div>
  </div>
</section>

<footer class="site-footer"></footer>
<script src="js/main.js"></script>
</body>
</html>
