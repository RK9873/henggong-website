<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="0.55" stop-color="#0e2138"/>
      <stop offset="1" stop-color="#132a44"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3350"/>
      <stop offset="1" stop-color="#0c1a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#9fd4ff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#5b9bd5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5b9bd5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cde8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#cde8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="machineL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101f33"/>
      <stop offset="1" stop-color="#1d3552"/>
    </linearGradient>
    <linearGradient id="machineR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#101f33"/>
      <stop offset="1" stop-color="#1d3552"/>
    </linearGradient>
  </defs>

  <!-- 背景与天花板 -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- 天花板桁架 -->
  <g stroke="#22405f" stroke-width="4" opacity="0.8">
    <line x1="0" y1="70" x2="1600" y2="70"/>
    <line x1="60" y1="130" x2="1540" y2="130"/>
    <line x1="160" y1="200" x2="1440" y2="200"/>
    <line x1="260" y1="260" x2="1340" y2="260"/>
  </g>
  <g stroke="#1c374f" stroke-width="3" opacity="0.7">
    <line x1="0" y1="0" x2="800" y2="378"/>
    <line x1="1600" y1="0" x2="800" y2="378"/>
    <line x1="400" y1="0" x2="800" y2="378"/>
    <line x1="1200" y1="0" x2="800" y2="378"/>
  </g>

  <!-- 远处尽头光 -->
  <rect x="700" y="300" width="200" height="85" fill="#dff0ff" opacity="0.9"/>
  <rect x="700" y="300" width="200" height="85" fill="url(#glow)"/>
  <ellipse cx="800" cy="380" rx="520" ry="260" fill="url(#glow)"/>

  <!-- 顶灯与光束 -->
  <g>
    <rect x="330" y="118" width="90" height="12" rx="3" fill="#e8f4ff"/>
    <polygon points="330,130 420,130 520,430 230,430" fill="url(#beam)"/>
    <rect x="1180" y="118" width="90" height="12" rx="3" fill="#e8f4ff"/>
    <polygon points="1180,130 1270,130 1370,430 1080,430" fill="url(#beam)"/>
    <rect x="640" y="190" width="70" height="10" rx="3" fill="#d5ecff"/>
    <polygon points="640,200 710,200 770,420 580,420" fill="url(#beam)" opacity="0.8"/>
    <rect x="890" y="190" width="70" height="10" rx="3" fill="#d5ecff"/>
    <polygon points="890,200 960,200 1020,420 830,420" fill="url(#beam)" opacity="0.8"/>
  </g>

  <!-- 地面 -->
  <polygon points="0,900 1600,900 1600,560 900,385 700,385 0,560" fill="url(#floor)"/>
  <polygon points="0,560 700,385 900,385 1600,560 1600,620 940,400 660,400 0,620" fill="#14273f"/>

  <!-- 黄色地面标线：向消失点汇聚 -->
  <g fill="#f2b705">
    <polygon points="60,900 190,900 762,410 742,410" opacity="0.95"/>
    <polygon points="1410,900 1540,900 858,410 838,410" opacity="0.95"/>
    <polygon points="530,900 600,900 782,412 770,412" opacity="0.7"/>
    <polygon points="1000,900 1070,900 830,412 818,412" opacity="0.7"/>
  </g>
  <!-- 黄色横向斑马警示线 -->
  <g fill="#f2b705" opacity="0.55">
    <rect x="640" y="770" width="46" height="14" transform="skewX(-18)"/>
    <rect x="720" y="770" width="46" height="14" transform="skewX(-18)"/>
    <rect x="800" y="770" width="46" height="14" transform="skewX(-18)"/>
    <rect x="880" y="770" width="46" height="14" transform="skewX(-18)"/>
  </g>

  <!-- 左侧设备剪影 -->
  <g>
    <rect x="0" y="330" width="250" height="330" fill="url(#machineL)"/>
    <rect x="250" y="365" width="130" height="255" fill="url(#machineL)" opacity="0.9"/>
    <rect x="380" y="385" width="90" height="200" fill="url(#machineL)" opacity="0.8"/>
    <rect x="470" y="395" width="60" height="165" fill="url(#machineL)" opacity="0.7"/>
    <rect x="30" y="370" width="60" height="8" fill="#3d6288"/>
    <rect x="270" y="395" width="40" height="6" fill="#3d6288"/>
    <circle cx="120" cy="450" r="14" fill="#0a1424"/>
    <circle cx="120" cy="450" r="6" fill="#48b0ff" opacity="0.8"/>
    <circle cx="310" cy="470" r="9" fill="#0a1424"/>
    <circle cx="310" cy="470" r="4" fill="#ffb648" opacity="0.9"/>
  </g>
  <!-- 右侧设备剪影 -->
  <g>
    <rect x="1350" y="330" width="250" height="330" fill="url(#machineR)"/>
    <rect x="1220" y="365" width="130" height="255" fill="url(#machineR)" opacity="0.9"/>
    <rect x="1130" y="385" width="90" height="200" fill="url(#machineR)" opacity="0.8"/>
    <rect x="1070" y="395" width="60" height="165" fill="url(#machineR)" opacity="0.7"/>
    <rect x="1510" y="370" width="60" height="8" fill="#3d6288"/>
    <rect x="1290" y="395" width="40" height="6" fill="#3d6288"/>
    <circle cx="1480" cy="450" r="14" fill="#0a1424"/>
    <circle cx="1480" cy="450" r="6" fill="#48b0ff" opacity="0.8"/>
    <circle cx="1290" cy="470" r="9" fill="#0a1424"/>
    <circle cx="1290" cy="470" r="4" fill="#ffb648" opacity="0.9"/>
  </g>

  <!-- 地面反光 -->
  <polygon points="740,410 860,410 1040,900 560,900" fill="#dff0ff" opacity="0.05"/>
  <rect width="1600" height="900" fill="#08111f" opacity="0.18"/>
</svg>
